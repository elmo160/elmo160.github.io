<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fortnite Spirits Tracker</title>
  
  <link rel="icon" type="image/webp" href="eye.webp">

  <style>
    :root {
      --bg-color: #0F1017;
      --panel-bg: #161824;
      --card-bg: #181A26;
      --border-color: #26293B;
      --text-color: #F4F1DE;
      --text-muted: #8E94B2;
      
      --accent-color: #E07A5F;
      --accent-glow: rgba(224, 122, 95, 0.35);
      --uncollected-color: rgba(239, 68, 68, 0.4);
      --collected-color: #4E9F3D;
      --mastered-color: #D4AF37;
      --mastered-glow: rgba(212, 175, 55, 0.45);
    }

    body.theme-s3 {
      --bg-color: #0C0A14;
      --panel-bg: #151221;
      --card-bg: #1D182B;
      --accent-color: #E07A5F;
      --accent-glow: rgba(224, 122, 95, 0.35);
      --border-color: #35263A;
    }

    body.theme-s4 {
      --bg-color: #0A0816;
      --panel-bg: #110E24;
      --card-bg: #191433;
      --accent-color: #9D4EDD;
      --accent-glow: rgba(157, 78, 221, 0.35);
      --border-color: #311F54;
    }

    body.theme-garden {
      --bg-color: #06120E;
      --panel-bg: #0B1C17;
      --card-bg: #122922;
      --accent-color: #10B981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --border-color: #194539;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      transition: background-color 0.4s ease;
    }

    .container {
      width: 100%;
      max-width: 1720px;
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 28px;
      border: 1px solid var(--border-color);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
      transition: all 0.4s ease;
    }

    .header { margin-bottom: 20px; }
    .header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: #FFFFFF;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 11px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .tab-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #FFF;
      border-color: var(--accent-color);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .capture-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 10px;
    }

    .zoom-value {
      font-size: 0.85rem;
      font-weight: 800;
      color: #FFF;
      min-width: 46px;
      text-align: center;
    }

    .btn-zoom {
      background: rgba(255, 255, 255, 0.08);
      color: white;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-zoom:hover { background: rgba(255, 255, 255, 0.2); }

    .action-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.2s ease, background-color 0.3s ease;
      touch-action: manipulation;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .header-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
      margin: 0 4px;
    }

    .btn-export { background-color: var(--accent-color); color: white; box-shadow: 0 2px 10px var(--accent-glow); }
    .btn-select { background-color: #2D6A4F; color: white; }
    .btn-master { background-color: #B5838D; color: white; }
    .btn-clear { background-color: #721C24; color: white; }

    .capture-select {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .capture-select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-section {
      background: rgba(0, 0, 0, 0.35);
      padding: 18px 22px;
      border-radius: 14px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .progress-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-info strong { color: #FFF; }
    .progress-info.mastered-info strong { color: #FFD700; }

    .progress-bar-bg {
      width: 100%;
      height: 9px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color);
      transition: width 0.4s ease;
    }

    .progress-bar-fill.mastered-fill {
      background: linear-gradient(90deg, #D4AF37 0%, #FFD700 100%);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    .filters-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .filter-select {
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .badge-variant {
      font-size: 0.64rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      line-height: 1.2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .badge-normal { background: linear-gradient(135deg, #475569, #94A3B8); color: #FFF; }
    .badge-gold { background: linear-gradient(135deg, #FFB300, #F57F17); color: #000; }
    .badge-gummy { background: linear-gradient(135deg, #FF4081, #F50057); color: #FFF; }
    .badge-galaxy { background: linear-gradient(135deg, #7C4DFF, #651FFF); color: #FFF; }
    .badge-holofoil, .badge-holo { background: linear-gradient(135deg, #00E676, #00B0FF); color: #000; }
    .badge-cube { background: linear-gradient(135deg, #AA00FF, #4A148C); color: #FFF; }
    .badge-gem { background: linear-gradient(135deg, #FFFFFF, #94A3B8); color: #0F172A; }
    .badge-quack { background: linear-gradient(135deg, #E9D5FF, #A855F7); color: #3B0764; }
    .badge-cheat, .badge-cheat-master { background: linear-gradient(135deg, #00E676, #00C853); color: #000; }
    /* Nuevo tono para Hacker matching al render del espíritu */
    .badge-hacker { background: linear-gradient(135deg, #3A86FF, #7209B7); color: #FFF; }
    .badge-reaper { background: linear-gradient(135deg, #FF1744, #D50000); color: #FFF; }
    .badge-trick, .badge-trick-treat, .badge-trick-or-treat { background: linear-gradient(135deg, #FF6D00, #DD2C00); color: #FFF; }

    .matrix-table-container {
      background-color: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    #content-render-area {
      transition: transform 0.2s ease;
    }

    .tab-content-panel {
      display: none;
    }
    .tab-content-panel.active-panel {
      display: block;
    }

    .matrix-grid {
      display: grid;
      gap: 12px;
      align-items: center;
      grid-template-columns: var(--col-first, 210px) repeat(var(--col-count, 8), minmax(105px, 1fr));
    }

    .matrix-header-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      border-radius: 8px;
    }

    .matrix-header-cell.spirit-col {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-muted);
      justify-content: flex-start;
      padding-left: 14px;
      background: transparent;
      border: none;
      letter-spacing: 1px;
    }

    .matrix-header-cell .header-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      user-select: none;
    }

    .matrix-header-cell .header-badge:hover {
      transform: translateY(-2px) scale(1.04);
      filter: brightness(1.15);
    }

    .spirit-info-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      justify-content: center;
    }

    .spirit-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .spirit-name {
      font-weight: 700;
      font-size: 1.02rem;
      color: #FFF;
    }

    .spirit-quick-actions {
      display: flex;
      gap: 4px;
    }

    .mini-btn {
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      padding: 2px;
      touch-action: manipulation;
    }

    .mini-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .mini-btn:hover { transform: scale(1.15); }
    .mini-select { background: #2D6A4F; color: #FFF; }
    .mini-master { background: #B5838D; color: #FFF; }
    .mini-clear { background: #721C24; color: #FFF; }

    .rarity-pill {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rarity-rare { background-color: rgba(30, 64, 175, 0.5); color: #93C5FD; border: 1px solid #1E40AF; }
    .rarity-epic { background-color: rgba(107, 33, 168, 0.5); color: #E9D5FF; border: 1px solid #6B21A8; }
    .rarity-legendary { background-color: rgba(154, 52, 18, 0.5); color: #FDBA74; border: 1px solid #9A3412; }
    .rarity-mythic { background-color: rgba(154, 126, 18, 0.5); color: #FEF08A; border: 1px solid #B45309; }

    .variant-slot {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      user-select: none;
      overflow: hidden;
      touch-action: manipulation;
    }

    .variant-slot:hover:not(.na):not(.empty-cell):not(.status-unreleased):not(.status-unavailable) {
      transform: translateY(-2px);
    }

    .variant-slot img {
      width: 78px;
      height: 78px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.65));
    }

    .variant-slot.status-none {
      background-color: rgba(185, 28, 28, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .variant-slot.status-none:hover {
      border-color: #EF4444;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }

    .variant-slot.status-collected {
      background-color: rgba(78, 159, 61, 0.25);
      border: 2px solid var(--collected-color);
      box-shadow: 0 0 12px rgba(78, 159, 61, 0.3);
    }

    .variant-slot.status-mastered {
      background-color: rgba(212, 175, 55, 0.25);
      border: 2px solid var(--mastered-color);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
    }

    .variant-slot.na {
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      cursor: not-allowed;
      opacity: 0.5;
    }

    .variant-slot.status-unreleased, .variant-slot.status-unavailable {
      background-color: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(239, 68, 68, 0.3);
      cursor: not-allowed;
      opacity: 0.55;
      padding-bottom: 4px;
    }

    .variant-slot.status-unreleased img, .variant-slot.status-unavailable img {
      height: 64px;
      width: 64px;
    }

    .unreleased-label {
      font-size: 0.62rem;
      font-weight: 800;
      color: #EF4444;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: auto;
      margin-bottom: 2px;
      z-index: 3;
      white-space: nowrap;
      line-height: 1;
    }

    .mastered-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .mastered-badge img {
      width: 22px !important;
      height: 22px !important;
      object-fit: contain !important;
      filter: drop-shadow(0 0 4px #FFD700) !important;
    }

    .horizontal-view-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .horizontal-view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .horizontal-view-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .horizontal-carousel {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      padding: 12px 6px 20px 6px;
    }

    .horizontal-card {
      flex: 0 0 180px;
      height: 240px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    .horizontal-card:hover {
      transform: translateY(-4px);
    }

    .horizontal-card.status-none {
      background-color: rgba(185, 28, 28, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .horizontal-card.status-none:hover {
      border-color: #EF4444;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }

    .horizontal-card.status-collected {
      background-color: rgba(78, 159, 61, 0.2);
      border: 2px solid var(--collected-color);
      box-shadow: 0 0 14px rgba(78, 159, 61, 0.35);
    }

    .horizontal-card.status-mastered {
      background-color: rgba(212, 175, 55, 0.2);
      border: 2px solid var(--mastered-color);
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.45);
    }

    .horizontal-card .card-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .horizontal-card .card-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: #FFF;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .horizontal-card .spirit-main-img {
      width: 105px;
      height: 105px;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.7));
      transition: transform 0.2s ease;
    }

    .horizontal-card .mastered-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
    }

    .horizontal-card .mastered-badge img {
      width: 22px !important;
      height: 22px !important;
      object-fit: contain !important;
      filter: drop-shadow(0 0 5px #FFD700) !important;
    }

    .garden-gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(540px, 1fr));
      gap: 28px;
    }

    .garden-card, .modal-content { transition: all 0.3s ease; }

    .card-rarity-rare {
      background: linear-gradient(180deg, rgba(0, 114, 255, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(0, 114, 255, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 114, 255, 0.3) !important;
    }
    .card-rarity-epic {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(168, 85, 247, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(168, 85, 247, 0.3) !important;
    }
    .card-rarity-legendary {
      background: linear-gradient(180deg, rgba(249, 115, 22, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(249, 115, 22, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(249, 115, 22, 0.3) !important;
    }
    .card-rarity-mythic {
      background: linear-gradient(180deg, rgba(234, 179, 8, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(234, 179, 8, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(234, 179, 8, 0.3) !important;
    }

    .garden-card {
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
    }

    .garden-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .garden-card-header .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
    }
    .garden-card-header .dot-rare { background-color: #0072FF; border: 2px solid #60A5FA; box-shadow: 0 0 10px rgba(0, 114, 255, 0.9); }
    .garden-card-header .dot-epic { background-color: #A855F7; border: 2px solid #F3E8FF; box-shadow: 0 0 10px rgba(168, 85, 247, 0.9); }
    .garden-card-header .dot-legendary { background-color: #F97316; border: 2px solid #FFEDD5; box-shadow: 0 0 10px rgba(249, 115, 22, 0.9); }
    .garden-card-header .dot-mythic { background-color: #EAB308; border: 2px solid #FEF9C3; box-shadow: 0 0 10px rgba(234, 179, 8, 0.9); }

    .garden-card-header h3 { font-size: 1.45rem; font-weight: 800; color: #FFF; }

    .garden-variants-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
    }

    .garden-vslot {
      position: relative;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 6px 6px 6px;
      transition: transform 0.15s ease;
      overflow: hidden;
      background: #131625;
      touch-action: manipulation;
    }

    .garden-vslot.bg-variant-normal { background: radial-gradient(circle at center, rgba(148, 163, 184, 0.28) 0%, rgba(15, 18, 32, 0.95) 75%); }

  <script>
    const SPIRIT_SLUGS = {
      "8 bit": "8bit",
      "burnt peanut": "peanut",
      "zero point": "zp",
      "grim reaper": "grim",
      "john wick": "john",
      "vini jr.": "vini",

    };

    const VARIANT_SLUGS = {
      "Normal": "normal",
      "Gold": "gold",
      "Gummy": "gummy",
      "Galaxy": "galaxy",
      "Holofoil": "holo",
      "Cube": "cube",

    };

    const VARIANT_DESCRIPTIONS = {
      "Normal": "Standard Sprite Variant",
      "Gold": "Gain 3x bonus XP from eliminations",
      "Gummy": "Gain 20% more Sprite Dust upon Extraction",
      "Galaxy": "Gain 30% more Ammo whenever picked up in the world",
      "Holofoil": "5% chance for your squad to find rare Sprite Variants from looting chests",
      "Holo": "5% chance for your squad to find rare Sprite Variants from looting chests",
      "Cube": "While in the Storm, gain the Overdrive Effect",
      "Gem": "Take 30% less Fall damage",
      "Quack": "Gives 50% Sprite XP to all other Sprites in your inventory",
      "Cheat Master": "Button mash! All inputs are correct when entering cheat codes found in the world.",
      "Hacker": "Increases chances of spawning items from your Loot Hacks.",
      "Reaper": "Siphon Health on eliminations.",
      "Trick or Treat": "Chance to find Candy when opening containers.",
      "Trick Treat": "Chance to find Candy when opening containers."
    };

    const VARIANT_GRADIENTS = {
      "normal": "radial-gradient(circle at center, rgba(148, 163, 184, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "gold": "radial-gradient(circle at center, rgba(255, 179, 0, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "gummy": "radial-gradient(circle at center, rgba(255, 64, 129, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "galaxy": "radial-gradient(circle at center, rgba(124, 77, 255, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "holo": "radial-gradient(circle at center, rgba(0, 230, 118, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "holofoil": "radial-gradient(circle at center, rgba(0, 230, 118, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "cube": "radial-gradient(circle at center, rgba(170, 0, 255, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "gem": "radial-gradient(circle at center, rgba(241, 245, 249, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "quack": "radial-gradient(circle at center, rgba(216, 180, 254, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "cheat": "radial-gradient(circle at center, rgba(0, 230, 118, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "hacker": "radial-gradient(circle at center, rgba(94, 96, 206, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "reaper": "radial-gradient(circle at center, rgba(255, 23, 68, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "trick": "radial-gradient(circle at center, rgba(255, 109, 0, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)"
    };

    const VARIANT_BORDER_COLORS = {
      "normal": "#94A3B8",
      "gold": "#FFB300",
      "gummy": "#FF4081",
      "galaxy": "#7C4DFF",
      "holo": "#00E676",
      "holofoil": "#00E676",
      "cube": "#AA00FF",
      "gem": "#FFFFFF",
      "quack": "#C084FC",
      "cheat": "#00E676",
      "hacker": "#5E60CE",
      "reaper": "#FF1744",
      "trick": "#FF6D00"
    };

    let currentTab = 'S3';
    let currentZoom = parseFloat(localStorage.getItem('fortnite_spirits_zoom')) || 1.0;
    let userProgress = JSON.parse(localStorage.getItem('fortnite_spirits_progress')) || {};
    const renderedPanels = { S3: false, S4: false, Garden: false };

    function changeZoom(delta) {
      currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 1.8);
      currentZoom = Math.round(currentZoom * 10) / 10;
      applyZoom();
      persistState();
    }

    function resetZoom() {
      currentZoom = 1.0;
      applyZoom();
      persistState();
    }

    function applyZoom() {
      const targetArea = document.getElementById('content-render-area');
      const zoomDisplay = document.getElementById('zoom-value');
      
      if (targetArea) {
        targetArea.style.transform = `scale(${currentZoom})`;
        targetArea.style.transformOrigin = 'top left';
        targetArea.style.width = (currentZoom !== 1.0) ? `${100 / currentZoom}%` : '100%';
      }

      if (zoomDisplay) {
        zoomDisplay.textContent = `${Math.round(currentZoom * 100)}%`;
      }
    }

    function persistState() {
      localStorage.setItem('fortnite_spirits_tab', currentTab);
      localStorage.setItem('fortnite_spirits_zoom', currentZoom);
      localStorage.setItem('fortnite_spirits_variant', document.getElementById('variant-filter')?.value || 'all');
      localStorage.setItem('fortnite_spirits_rarity', document.getElementById('rarity-filter')?.value || 'all');
      localStorage.setItem('fortnite_spirits_status', document.getElementById('status-filter')?.value || 'all');
      localStorage.setItem('fortnite_spirits_capture_scope', document.getElementById('capture-scope')?.value || 'all');
    }

    function invalidateAllPanels() {
      renderedPanels.S3 = false;
      renderedPanels.S4 = false;
      renderedPanels.Garden = false;
    }

    function resetVariantFilter() {
      const searchInput = document.getElementById('search-input');
      const variantSelect = document.getElementById('variant-filter');
      if (searchInput) searchInput.value = '';
      if (variantSelect) variantSelect.value = 'all';
      persistState();
      invalidateAllPanels();
      renderActiveTab();
    }

    function onFilterChange() {
      persistState();
      invalidateAllPanels();
      renderActiveTab();
    }

    function toggleHeaderVariant(variantName) {
      const select = document.getElementById('variant-filter');
      if (!select) return;

      if (select.value === variantName) {
        select.value = 'all';
      } else {
        select.value = variantName;
      }
      onFilterChange();
    }

    function doesStatusMatchFilter(spirit, vName, currentStatus, filter) {
      const exists = isVariantExist(spirit, vName);
      const inactive = isVariantInactive(spirit, vName);

      if (!exists || inactive) return filter === 'all';
      if (filter === 'all') return true;
      if (filter === 'collected') return currentStatus === 'collected' || currentStatus === 'mastered';
      if (filter === 'mastered') return currentStatus === 'mastered';
      if (filter === 'none') return currentStatus === 'none';
      if (filter === 'not-mastered') return currentStatus === 'collected';
      return true;
    }

    function getVariantBadgeClass(vName) {
      const slug = (VARIANT_SLUGS[vName] || vName.toLowerCase()).replace(/\s+/g, '-');
      return `badge-${slug}`;
    }

    function getVariantRawStatus(spirit, variantName) {
      if (!spirit || !spirit.variants) return "Not Exist";
      const vObj = spirit.variants[variantName];
      if (!vObj) return "Not Exist";
      if (typeof vObj === 'string') return vObj;
      return vObj.status || (vObj.name ? "Available" : "Not Exist");
    }

    function isVariantExist(spirit, variantName) {
      const status = getVariantRawStatus(spirit, variantName);
      return !(status === "Not Exist" || status === "Unreleased" || status === "Unavailable");
    }

    function isVariantInactive(spirit, variantName) {
      const status = getVariantRawStatus(spirit, variantName);
      return status === "Unreleased" || status === "Unavailable" || status === "Blocked";
    }

    function isVariantDefined(spirit, variantName) {
      const status = getVariantRawStatus(spirit, variantName);
      return status !== "Not Exist";
    }

    function getVariantsList() {
      if (currentTab === 'S3') {
        return (typeof S3_VARIANTS !== 'undefined') ? S3_VARIANTS : ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack"];
      }
      if (currentTab === 'S4') {
        return (typeof S4_VARIANTS !== 'undefined') ? S4_VARIANTS : ["Normal", "Gold", "Cheat Master", "Hacker", "Trick or Treat", "Holofoil", "Reaper", "Gummy"];
      }
      return ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack", "Cheat Master", "Hacker", "Trick or Treat", "Reaper"];
    }

    function getSpiritsList() {
      if (typeof SPIRITS_DATA === 'undefined' || !SPIRITS_DATA) return [];
      
      if (currentTab === 'S3') {
        return (SPIRITS_DATA.S3 || []).map(s => ({ ...s, _season: 'S3' }));
      }
      if (currentTab === 'S4') {
        return (SPIRITS_DATA.S4 || []).map(s => ({ ...s, _season: 'S4' }));
      }
      if (currentTab === 'Garden') {
        const s3 = (SPIRITS_DATA.S3 || []).map(s => ({ ...s, _season: 'S3' }));
        const s4 = (SPIRITS_DATA.S4 || []).map(s => ({ ...s, _season: 'S4' }));
        return [...s3, ...s4];
      }
      return [];
    }

    function saveProgress() {
      localStorage.setItem('fortnite_spirits_progress', JSON.stringify(userProgress));
      updateProgressUI();
    }

    function switchTab(tab, element) {
      currentTab = tab;
      
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.value = '';

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = element || document.getElementById(`btn-tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.body.className = `theme-${tab.toLowerCase()}`;
      
      document.querySelectorAll('.tab-content-panel').forEach(p => p.classList.remove('active-panel'));
      const targetPanel = document.getElementById(`panel-${tab}`);
      if (targetPanel) targetPanel.classList.add('active-panel');

      const scopeSelect = document.getElementById('capture-scope');
      if (scopeSelect) {
        if (tab === 'Garden') {
          scopeSelect.value = 'all';
          scopeSelect.disabled = true;
        } else {
          scopeSelect.disabled = false;
          scopeSelect.value = localStorage.getItem('fortnite_spirits_capture_scope') || 'all';
        }
      }

      persistState();
      updateProgressUI();
      invalidateAllPanels();
      renderActiveTab();
    }

    function updateProgressUI() {
      let totalItems = 0;
      let collectedCount = 0;
      let masteredCount = 0;

      const spirits = getSpiritsList();

      spirits.forEach(spirit => {
        const season = spirit._season || 'S3';
        const variantsList = (season === 'S4')
          ? ((typeof S4_VARIANTS !== 'undefined') ? S4_VARIANTS : ["Normal", "Gold", "Cheat Master", "Hacker", "Trick or Treat", "Holofoil", "Reaper", "Gummy"])
          : ((typeof S3_VARIANTS !== 'undefined') ? S3_VARIANTS : ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack"]);

        variantsList.forEach(vName => {
          if (isVariantExist(spirit, vName) && !isVariantInactive(spirit, vName)) {
            totalItems++;
            const status = userProgress[`${spirit.id}_${vName}`];
            if (status === 'collected' || status === 'mastered') collectedCount++;
            if (status === 'mastered') masteredCount++;
          }
        });
      });

      const collectedPct = totalItems > 0 ? Math.round((collectedCount / totalItems) * 100) : 0;
      const masteredPct = totalItems > 0 ? Math.round((masteredCount / totalItems) * 100) : 0;

      document.getElementById('collected-count').textContent = `${collectedCount}/${totalItems}`;
      document.getElementById('progress-pct').textContent = `${collectedPct}%`;
      document.getElementById('progress-bar-fill').style.width = `${collectedPct}%`;

      document.getElementById('mastered-count').textContent = `${masteredCount}/${totalItems}`;
      document.getElementById('mastered-pct').textContent = `${masteredPct}%`;
      document.getElementById('mastered-bar-fill').style.width = `${masteredPct}%`;
    }

    function renderActiveTab(overrideStatusFilter) {
      const selectedVariant = document.getElementById('variant-filter')?.value || 'all';
      const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const activePanel = document.getElementById(`panel-${currentTab}`);
      if (!activePanel) return;

      if (currentTab === 'Garden') {
        renderGardenGallery(activePanel, overrideStatusFilter);
      } else {
        const variantsList = getVariantsList();
        const matchedVariant = variantsList.find(v => v.toLowerCase() === searchVal || (VARIANT_SLUGS[v] && VARIANT_SLUGS[v] === searchVal));

        if (selectedVariant !== 'all') {
          renderHorizontalVariantView(activePanel, selectedVariant, overrideStatusFilter);
        } else if (matchedVariant) {
          renderHorizontalVariantView(activePanel, matchedVariant, overrideStatusFilter);
        } else {
          renderMatrixTable(activePanel, overrideStatusFilter);
        }
      }

      renderedPanels[currentTab] = true;
      applyZoom();
      updateProgressUI();
    }

    function handleImgError(imgEl, seasonDir, spiritSlug, variantSlug) {
      imgEl.onerror = null;
      const cleanSlug = spiritSlug.replace(/[^a-z0-9]/gi, '');

      const fallbacks = [
        `assets/${seasonDir}/${spiritSlug}_${variantSlug}.webp`,
        `assets/unreleased/${spiritSlug}_${variantSlug}.webp`,
        `assets/${seasonDir}/${cleanSlug}_${variantSlug}.webp`,
        `assets/unreleased/${cleanSlug}_${variantSlug}.webp`,
        `${spiritSlug}_${variantSlug}.webp`
      ];

      let step = 0;
      function tryNext() {
        if (step < fallbacks.length) {
          const nextSrc = fallbacks[step++];
          imgEl.onerror = tryNext;
          imgEl.src = nextSrc;
        } else {
          imgEl.onerror = null;
          imgEl.style.display = 'none';
          const slot = imgEl.parentElement;
          if (slot && !slot.querySelector('.fallback-placeholder')) {
            const ph = document.createElement('span');
            ph.className = 'fallback-placeholder';
            ph.innerHTML = '👁️';
            ph.style.cssText = 'font-size: 1.5rem; opacity: 0.3; margin: auto;';
            slot.appendChild(ph);
          }
        }
      }
      tryNext();
    }

    function renderHorizontalVariantView(container, variantName, overrideStatusFilter) {
      const spirits = getSpiritsList();
      const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const rarityFilter = document.getElementById('rarity-filter')?.value || 'all';
      const statusFilter = overrideStatusFilter !== undefined ? overrideStatusFilter : (document.getElementById('status-filter')?.value || 'all');

      const badgeClass = getVariantBadgeClass(variantName);
      const variantSlug = VARIANT_SLUGS[variantName] || variantName.toLowerCase();

      let matchingSpirits = [];

      spirits.forEach(spirit => {
        const spiritName = spirit.name || 'Unknown';
        const spiritRarity = (spirit.rarity || 'Rare').toLowerCase();
        const spiritId = spirit.id || spiritName;

        const matchesName = spiritName.toLowerCase().includes(searchVal);
        const matchesVariant = variantName.toLowerCase().includes(searchVal);

        if (searchVal && !matchesName && !matchesVariant) return;
        if (rarityFilter !== 'all' && spiritRarity !== rarityFilter.toLowerCase()) return;

        const exists = isVariantExist(spirit, variantName);
        const inactive = isVariantInactive(spirit, variantName);
        const currentStatus = userProgress[`${spiritId}_${variantName}`] || 'none';

        if (exists && !inactive && doesStatusMatchFilter(spirit, variantName, currentStatus, statusFilter)) {
          matchingSpirits.push({ spirit, spiritId, spiritName, spiritRarity, currentStatus });
        }
      });

      if (matchingSpirits.length === 0) {
        container.innerHTML = `
          <div class="horizontal-view-container">
            <div class="horizontal-view-header">
              <h2>
                <span>Variant:</span>
                <span class="header-badge ${badgeClass}" onclick="resetVariantFilter()" title="Click to clear">${variantName} ✕</span>
              </h2>
              <button class="action-btn btn-clear" onclick="resetVariantFilter()" style="padding: 6px 14px; font-size: 0.82rem;">
                ⬅️ Back to Full Table
              </button>
            </div>
            <div class="empty-warning" style="text-align:center; padding:40px; color:var(--text-muted);">
              ⚠️ No spirits available for variant <strong>${variantName}</strong> with current filters.
            </div>
          </div>`;
        return;
      }

      let html = `
        <div class="horizontal-view-container">
          <div class="horizontal-view-header">
            <h2>
              <span>Variant:</span>
              <span class="header-badge ${badgeClass}" onclick="resetVariantFilter()" title="Click to clear filter">${variantName} ✕</span>
              <span style="font-size: 0.9rem; color: var(--text-muted);">(${matchingSpirits.length} spirits)</span>
            </h2>
            <button class="action-btn btn-clear" onclick="resetVariantFilter()" style="padding: 6px 14px; font-size: 0.82rem;">
              ⬅️ Back to Full Table
            </button>
          </div>
          <div class="horizontal-carousel">
      `;

      matchingSpirits.forEach(({ spirit, spiritId, spiritName, spiritRarity, currentStatus }) => {
        const spiritSlug = SPIRIT_SLUGS[spiritName.toLowerCase()] || spiritName.toLowerCase().replace(/\s+/g, '-');
        const seasonDir = spirit._season || currentTab;
        const imgPathPrimary = `assets/${seasonDir}/${spiritSlug}_${variantSlug}.webp`;
        const slotStateClass = `status-${currentStatus}`;

        html += `
          <div class="horizontal-card ${slotStateClass}" onclick="toggleVariantState('${spiritId}', '${variantName}')">
            ${currentStatus === 'mastered' ? '<span class="mastered-badge"><img src="crown.webp" onerror="this.onerror=null; this.src=\'assets/crown.webp\';" alt="👑"></span>' : ''}
            <div class="card-top">
              <span class="badge-variant ${badgeClass}">${variantName}</span>
              <span class="rarity-pill rarity-${spiritRarity}">${spiritRarity.toUpperCase()}</span>
            </div>
            <img class="spirit-main-img" src="${imgPathPrimary}" alt="${spiritName}" loading="lazy" decoding="async"
                 onerror="handleImgError(this, '${seasonDir}', '${spiritSlug}', '${variantSlug}')">
            <span class="card-title">${spiritName}</span>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderMatrixTable(container, overrideStatusFilter) {
      const spirits = getSpiritsList();
      const activeVariants = getVariantsList();

      if (spirits.length === 0) {
        container.innerHTML = '<div class="empty-warning">⚠️ No spirits found for this category.</div>';

      }

      const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const rarityFilter = document.getElementById('rarity-filter')?.value || 'all';
      const statusFilter = overrideStatusFilter !== undefined ? overrideStatusFilter : (document.getElementById('status-filter')?.value || 'all');

      let visibleVariants = activeVariants;
      if (statusFilter !== 'all') {
        visibleVariants = activeVariants.filter(vName => 
          spirits.some(spirit => {
            const status = userProgress[`${spirit.id}_${vName}`] || 'none';
            return doesStatusMatchFilter(spirit, vName, status, statusFilter);
          })
        );
      }

      let html = `<div class="matrix-grid" style="--col-count: ${visibleVariants.length};">`;

      html += `<div class="matrix-header-cell spirit-col">SPRITE</div>`;
      visibleVariants.forEach(vName => {
        const badgeClass = getVariantBadgeClass(vName);

        if (searchVal && !matchesName) return;
        if (rarityFilter !== 'all' && spiritRarity.toLowerCase() !== rarityFilter.toLowerCase()) return;

        let matchingVariantsCount = 0;
        visibleVariants.forEach(vName => {
          const currentStatus = userProgress[`${spiritId}_${vName}`] || 'none';
          if (doesStatusMatchFilter(spirit, vName, currentStatus, statusFilter)) {
            matchingVariantsCount++;
          }
        });

        if (statusFilter !== 'all' && matchingVariantsCount === 0) return;

        html += `

                </button>
                <button class="mini-btn mini-clear" title="Clear All" onclick="setSpiritState('${spiritId}', 'none')">
                  <img src="red.webp" onerror="this.onerror=null; this.src='assets/red.webp'; this.onerror=function(){this.replaceWith('✕');};" alt="✕">
                </button>
              </div>
            </div>
            <span class="rarity-pill rarity-${spiritRarity.toLowerCase()}">${spiritRarity.toUpperCase()}</span>
          </div>
        `;

        const spiritSlug = SPIRIT_SLUGS[spiritName.toLowerCase()] || spiritName.toLowerCase().replace(/\s+/g, '-');
        const seasonDir = spirit._season || currentTab;

        visibleVariants.forEach(vName => {
          const exists = isVariantExist(spirit, vName);
          const inactive = isVariantInactive(spirit, vName);
          const key = `${spiritId}_${vName}`;
          const currentStatus = userProgress[key] || 'none';
          const isMatch = doesStatusMatchFilter(spirit, vName, currentStatus, statusFilter);

          if (!isMatch) {
            html += `<div class="variant-slot empty-cell"></div>`;
          } else if (!exists && !inactive) {
            html += `<div class="variant-slot na"></div>`;
          } else if (inactive) {

            html += `
              <div class="variant-slot status-unreleased">
                <img src="${imgPathPrimary}" alt="${spiritName}" loading="lazy" decoding="async"

                <span class="unreleased-label">Unreleased</span>
              </div>

            const masteredIconHTML = `<span class="mastered-badge"><img src="crown.webp" onerror="this.onerror=null; this.src='assets/crown.webp'; this.onerror=function(){this.replaceWith('👑');};" alt="👑"></span>`;

            const clickAction = `onclick="toggleVariantState('${spiritId}', '${vName}')"`;

              <div class="variant-slot ${slotStateClass}" ${clickAction}>
                ${currentStatus === 'mastered' ? masteredIconHTML : ''}

      });

      html += `</div>`;

    function renderGardenGallery(container, overrideStatusFilter) {

      const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const variantFilter = document.getElementById('variant-filter')?.value || 'all';

      let visibleCardCount = 0;

      spirits.forEach(spirit => {

        const spiritRarity = (spirit.rarity || 'Rare').toLowerCase();
        const spiritId = spirit.id || spiritName;
        const seasonDir = spirit._season || 'S3';

        // Obtener el orden estricto de variantes de la temporada correspondiente al espíritu
        const spiritVariantsList = (seasonDir === 'S4')
          ? ((typeof S4_VARIANTS !== 'undefined') ? S4_VARIANTS : ["Normal", "Gold", "Cheat Master", "Hacker", "Trick or Treat", "Holofoil", "Reaper", "Gummy"])
          : ((typeof S3_VARIANTS !== 'undefined') ? S3_VARIANTS : ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack"]);

        const matchesName = spiritName.toLowerCase().includes(searchVal);
        const matchesVariantSearch = spiritVariantsList.some(vName => 
          vName.toLowerCase().includes(searchVal) && isVariantDefined(spirit, vName)
        );

        if (searchVal && !matchesName && !matchesVariantSearch) return;
        if (rarityFilter !== 'all' && spiritRarity !== rarityFilter.toLowerCase()) return;

        const validSlots = spiritVariantsList.filter(vName => {
          const defined = isVariantDefined(spirit, vName);
          if (!defined) return false;

          const currentStatus = userProgress[`${spiritId}_${vName}`] || 'none';
          const isMatch = doesStatusMatchFilter(spirit, vName, currentStatus, statusFilter);
          const matchesVariantFilter = (variantFilter === 'all') || (vName.toLowerCase() === variantFilter.toLowerCase());
          const matchesSearchExact = !searchVal || matchesName || vName.toLowerCase().includes(searchVal);

          return isMatch && matchesVariantFilter && matchesSearchExact;

            <div class="garden-variants-grid">

        validSlots.forEach(vName => {
          const inactive = isVariantInactive(spirit, vName);

          if (inactive) {

              <div class="garden-vslot bg-variant-${variantSlug.replace(/\s+/g, '-')} status-unreleased">

              <div class="garden-vslot ${bgVariantClass} ${slotClass}" ${clickAttr}>

          <div class="horizontal-view-header" style="margin-bottom: 20px;">

              <span>Garden Filter:</span>
              <span class="header-badge badge-normal" onclick="resetVariantFilter()" title="Click to clear filter">${variantFilter !== 'all' ? variantFilter : searchVal} ✕</span>
            </h2>
            <button class="action-btn btn-clear" onclick="resetVariantFilter()" style="padding: 6px 14px; font-size: 0.82rem;">
              ⬅️ Back to Full View
            </button>
          </div>
          <div class="empty-warning" style="text-align:center; padding:40px; color:var(--text-muted);">
            ⚠️ No spirits found matching current filters.
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function toggleVariantState(spiritId, variant) {
      if (currentTab === 'Garden') return;

      const spirits = getSpiritsList();
      const targetSpirit = spirits.find(s => s.id === spiritId);
      if (targetSpirit && isVariantInactive(targetSpirit, variant)) return;

      const key = `${spiritId}_${variant}`;
      const currentState = userProgress[key] || 'none';

      if (currentState === 'none') {
        userProgress[key] = 'collected';
      } else if (currentState === 'collected') {
        userProgress[key] = 'mastered';
      } else {
        delete userProgress[key];
      }

      saveProgress();
      invalidateAllPanels();
      renderActiveTab();
    }

    function setSpiritState(spiritId, targetState) {
      const spirits = getSpiritsList();
      const targetSpirit = spirits.find(s => s.id === spiritId);
      if (!targetSpirit) return;

      const season = targetSpirit._season || 'S3';
      const variantsList = (season === 'S4')
        ? ((typeof S4_VARIANTS !== 'undefined') ? S4_VARIANTS : ["Normal", "Gold", "Cheat Master", "Hacker", "Trick or Treat", "Holofoil", "Reaper", "Gummy"])
        : ((typeof S3_VARIANTS !== 'undefined') ? S3_VARIANTS : ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack"]);

      variantsList.forEach(vName => {
        if (isVariantExist(targetSpirit, vName) && !isVariantInactive(targetSpirit, vName)) {
          if (targetState === 'none') {
            delete userProgress[`${spiritId}_${vName}`];
          } else {
            userProgress[`${spiritId}_${vName}`] = targetState;
          }
        }
      });

      saveProgress();
      invalidateAllPanels();
      renderActiveTab();
    }

    function selectAllCurrentTab() { setTabState('collected'); }
    function masterAllCurrentTab() { setTabState('mastered'); }
    function clearAllCurrentTab() {
      const spirits = getSpiritsList();
      spirits.forEach(spirit => {
        const season = spirit._season || 'S3';
        const variantsList = (season === 'S4')
          ? ((typeof S4_VARIANTS !== 'undefined') ? S4_VARIANTS : ["Normal", "Gold", "Cheat Master", "Hacker", "Trick or Treat", "Holofoil", "Reaper", "Gummy"])
          : ((typeof S3_VARIANTS !== 'undefined') ? S3_VARIANTS : ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack"]);

        variantsList.forEach(vName => {
          delete userProgress[`${spirit.id}_${vName}`];
        });
      });
      saveProgress();
      invalidateAllPanels();
      renderActiveTab();
    }

    function setTabState(targetState) {
      const spirits = getSpiritsList();
      spirits.forEach(spirit => {
        const season = spirit._season || 'S3';
        const variantsList = (season === 'S4')
          ? ((typeof S4_VARIANTS !== 'undefined') ? S4_VARIANTS : ["Normal", "Gold", "Cheat Master", "Hacker", "Trick or Treat", "Holofoil", "Reaper", "Gummy"])
          : ((typeof S3_VARIANTS !== 'undefined') ? S3_VARIANTS : ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack"]);

        variantsList.forEach(vName => {
          if (isVariantExist(spirit, vName) && !isVariantInactive(spirit, vName)) {
            userProgress[`${spirit.id}_${vName}`] = targetState;
          }
        });
      });
      saveProgress();
      invalidateAllPanels();
      renderActiveTab();
    }

    function openSpiritModal(spiritId, variantName) {
      const spirits = getSpiritsList();
      const spirit = spirits.find(s => s.id === spiritId);
      if (!spirit) return;

      const season = spirit._season || 'S3';
      const spiritName = spirit.name;
      const spiritRarity = (spirit.rarity || 'Rare').toLowerCase();
      const spiritSlug = SPIRIT_SLUGS[spiritName.toLowerCase()] || spiritName.toLowerCase().replace(/\s+/g, '-');
      const variantSlug = VARIANT_SLUGS[variantName] || variantName.toLowerCase();

      const imgPathPrimary = `assets/${season}/${spiritSlug}_${variantSlug}.webp`;

      const modalContent = document.getElementById('modal-card-content');
      modalContent.className = `modal-content card-rarity-${spiritRarity}`;

      const modalRarityBadge = document.getElementById('modal-rarity-badge');
      if (modalRarityBadge) {
        modalRarityBadge.textContent = (spirit.rarity || 'Rare').toUpperCase();
        modalRarityBadge.className = `rarity-pill rarity-${spiritRarity}`;
      }

      const modalSeasonBadge = document.getElementById('modal-season');
      modalSeasonBadge.textContent = season;
      modalSeasonBadge.className = `modal-season-badge modal-season-${season.toLowerCase()}`;

      const modalVariantBadge = document.getElementById('modal-variant-badge');
      if (modalVariantBadge) {
        modalVariantBadge.textContent = variantName;
        modalVariantBadge.className = `badge-variant ${getVariantBadgeClass(variantName)}`;
      }

      const frameEl = document.getElementById('modal-img-frame');
      const gradientBg = VARIANT_GRADIENTS[variantSlug] || VARIANT_GRADIENTS["normal"];
      const borderColor = VARIANT_BORDER_COLORS[variantSlug] || "#94A3B8";

      frameEl.style.background = gradientBg;
      frameEl.style.borderColor = borderColor;
      frameEl.style.boxShadow = `0 0 38px ${borderColor}80, 0 10px 32px rgba(0,0,0,0.85)`;

      document.getElementById('modal-title').textContent = `${variantName} ${spiritName}`;
      
      const imgEl = document.getElementById('modal-img');
      imgEl.style.display = 'block';
      imgEl.src = imgPathPrimary;
      imgEl.onerror = function() {
        handleImgError(this, season, spiritSlug, variantSlug);
      };

      document.getElementById('modal-desc-main').textContent = spirit.desc_sprite || "Replenish shields while standing in water!";
      
      let subDesc = spirit.desc_level || "Increases in power at each Level Up per tick:";
      if (spirit.levels && Object.keys(spirit.levels).length > 0) {
        subDesc += " " + Object.entries(spirit.levels).map(([k, v]) => `${k}: ${v}`).join(' | ');
      }
      document.getElementById('modal-desc-sub').textContent = subDesc;

      const xpBanner = document.getElementById('modal-xp-banner');
      xpBanner.textContent = VARIANT_DESCRIPTIONS[variantName] || "Standard Sprite Variant perk applied.";

      document.getElementById('spirit-modal').classList.add('active');
    }

    function closeModal(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      document.getElementById('spirit-modal').classList.remove('active');
    }

    async function exportCard() {
      let captureScope = document.getElementById('capture-scope')?.value || 'all';
      if (currentTab === 'Garden') captureScope = 'all';

      let filterOverride = 'all';
      if (captureScope === 'collected') filterOverride = 'collected';
      if (captureScope === 'uncollected') filterOverride = 'none';
      if (captureScope === 'mastered') filterOverride = 'mastered';
      if (captureScope === 'not-mastered') filterOverride = 'not-mastered';

      const savedZoom = currentZoom;
      resetZoom();

      invalidateAllPanels();
      renderActiveTab(filterOverride);

      const captureElement = document.getElementById('capture-area-container');
      const btn = document.querySelector('.btn-export');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Processing...';
      btn.disabled = true;

      captureElement.classList.add('is-capturing');

      await new Promise(resolve => setTimeout(resolve, 80));

      try {
        if (typeof html2canvas !== 'undefined') {
          const canvas = await html2canvas(captureElement, { 
            scale: 1.2,
            useCORS: true,
            logging: false,
            backgroundColor: '#0C0A14'
          });

          const link = document.createElement('a');
          link.download = `spirits-${currentTab.toLowerCase()}-${captureScope}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } else {
          alert('html2canvas.min.js is not loaded properly.');
        }
      } catch (err) {
        console.error("Capture Export Error:", err);
      } finally {
        captureElement.classList.remove('is-capturing');
        btn.innerHTML = originalText;
        btn.disabled = false;

        currentZoom = savedZoom;
        invalidateAllPanels();
        renderActiveTab();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.value = '';

      const savedTab = localStorage.getItem('fortnite_spirits_tab') || 'S3';
      const savedVariant = localStorage.getItem('fortnite_spirits_variant') || 'all';
      const savedRarity = localStorage.getItem('fortnite_spirits_rarity') || 'all';
      const savedStatus = localStorage.getItem('fortnite_spirits_status') || 'all';
      const savedScope = localStorage.getItem('fortnite_spirits_capture_scope') || 'all';

      if (document.getElementById('variant-filter')) document.getElementById('variant-filter').value = savedVariant;
      if (document.getElementById('rarity-filter')) document.getElementById('rarity-filter').value = savedRarity;
      if (document.getElementById('status-filter')) document.getElementById('status-filter').value = savedStatus;
      if (document.getElementById('capture-scope')) document.getElementById('capture-scope').value = savedScope;

      switchTab(savedTab);
      applyZoom();
    });
  </script>
</body>
