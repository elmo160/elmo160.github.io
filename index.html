<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortnite Spirits Tracker</title>
  <style>
    :root {
      --bg-color: #0F1017;
      --panel-bg: #161824;
      --card-bg: #181A26;
      --border-color: #26293B;
      --text-color: #F4F1DE;
      --text-muted: #8E94B2;
      
      --accent-color: #E07A5F;
      --accent-glow: rgba(224, 122, 95, 0.35);
      --collected-color: #4E9F3D;
      --mastered-color: #D4AF37;
      --mastered-glow: rgba(212, 175, 55, 0.45);
    }

    body.theme-s3 {
      --bg-color: #0C0A14;
      --panel-bg: #151221;
      --card-bg: #1D182B;
      --accent-color: #E07A5F;
      --accent-glow: rgba(224, 122, 95, 0.35);
      --border-color: #35263A;
    }

    body.theme-s4 {
      --bg-color: #0A0816;
      --panel-bg: #110E24;
      --card-bg: #191433;
      --accent-color: #9D4EDD;
      --accent-glow: rgba(157, 78, 221, 0.35);
      --border-color: #311F54;
    }

    body.theme-garden {
      --bg-color: #06120E;
      --panel-bg: #0B1C17;
      --card-bg: #122922;
      --accent-color: #10B981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --border-color: #194539;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      transition: background-color 0.4s ease;
    }

    .container {
      width: 100%;
      max-width: 1720px;
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 28px;
      border: 1px solid var(--border-color);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
      transition: all 0.4s ease;
    }

    .header { margin-bottom: 20px; }
    .header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: #FFFFFF;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 11px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #FFF;
      border-color: var(--accent-color);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .capture-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .action-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.2s ease, background-color 0.3s ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .header-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
      margin: 0 4px;
    }

    .btn-export { background-color: var(--accent-color); color: white; box-shadow: 0 2px 10px var(--accent-glow); }
    .btn-select { background-color: #2D6A4F; color: white; }
    .btn-master { background-color: #B5838D; color: white; }
    .btn-clear { background-color: #721C24; color: white; }

    .capture-select {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .capture-select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Doble Sección de Progreso */
    .progress-section {
      background: rgba(0, 0, 0, 0.35);
      padding: 18px 22px;
      border-radius: 14px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .progress-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-info strong { color: #FFF; }
    .progress-info.mastered-info strong { color: #FFD700; }

    .progress-bar-bg {
      width: 100%;
      height: 9px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color);
      transition: width 0.4s ease;
    }

    .progress-bar-fill.mastered-fill {
      background: linear-gradient(90deg, #D4AF37 0%, #FFD700 100%);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    /* Filtros */
    .filters-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .filter-select {
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* INSIGNIAS DE VARIANTES */
    .badge-variant {
      font-size: 0.64rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      line-height: 1.2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .badge-normal { background: linear-gradient(135deg, #475569, #94A3B8); color: #FFF; }
    .badge-gold { background: linear-gradient(135deg, #FFB300, #F57F17); color: #000; }
    .badge-gummy { background: linear-gradient(135deg, #FF4081, #F50057); color: #FFF; }
    .badge-galaxy { background: linear-gradient(135deg, #7C4DFF, #651FFF); color: #FFF; }
    .badge-holofoil, .badge-holo { background: linear-gradient(135deg, #00E676, #00B0FF); color: #000; }
    .badge-cube { background: linear-gradient(135deg, #AA00FF, #4A148C); color: #FFF; }
    .badge-gem { background: linear-gradient(135deg, #FFFFFF, #94A3B8); color: #0F172A; }
    .badge-quack { background: linear-gradient(135deg, #E9D5FF, #A855F7); color: #3B0764; }
    .badge-cheat, .badge-cheat-master { background: linear-gradient(135deg, #00E676, #00C853); color: #000; }
    .badge-hacker { background: linear-gradient(135deg, #1DE9B6, #00BFA5); color: #000; }
    .badge-reaper { background: linear-gradient(135deg, #FF1744, #D50000); color: #FFF; }
    .badge-trick, .badge-trick-treat { background: linear-gradient(135deg, #FF6D00, #DD2C00); color: #FFF; }

    /* Matriz S3 / S4 */
    .matrix-table-container {
      background-color: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      padding: 20px;
    }

    .matrix-grid {
      display: grid;
      gap: 12px;
      align-items: center;
    }

    .matrix-header-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      border-radius: 8px;
    }

    .matrix-header-cell.spirit-col {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-muted);
      justify-content: flex-start;
      padding-left: 14px;
      background: transparent;
      border: none;
      letter-spacing: 1px;
    }

    .matrix-header-cell .header-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .spirit-info-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      justify-content: center;
    }

    .spirit-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .spirit-name {
      font-weight: 700;
      font-size: 1.02rem;
      color: #FFF;
    }

    .spirit-quick-actions {
      display: flex;
      gap: 4px;
    }

    .mini-btn {
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      padding: 2px;
    }

    .mini-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .mini-btn:hover { transform: scale(1.15); }
    .mini-select { background: #2D6A4F; color: #FFF; }
    .mini-master { background: #B5838D; color: #FFF; }
    .mini-clear { background: #721C24; color: #FFF; }

    .rarity-pill {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rarity-rare { background-color: rgba(30, 64, 175, 0.5); color: #93C5FD; border: 1px solid #1E40AF; }
    .rarity-epic { background-color: rgba(107, 33, 168, 0.5); color: #E9D5FF; border: 1px solid #6B21A8; }
    .rarity-legendary { background-color: rgba(154, 52, 18, 0.5); color: #FDBA74; border: 1px solid #9A3412; }
    .rarity-mythic { background-color: rgba(154, 126, 18, 0.5); color: #FEF08A; border: 1px solid #B45309; }

    .variant-slot {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      overflow: hidden;
    }

    .variant-slot:hover:not(.na):not(.empty-cell):not(.status-inactive) {
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .variant-slot img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.65));
    }

    .variant-slot.na {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      cursor: not-allowed;
      opacity: 0.3;
    }

    .variant-slot.na::after {
      content: "⊘";
      font-size: 1.4rem;
      color: rgba(255, 255, 255, 0.15);
    }

    .variant-slot.empty-cell {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      border: none;
      background: transparent;
    }

    .variant-slot.status-inactive {
      opacity: 0.38;
      filter: grayscale(60%);
      cursor: not-allowed;
    }

    .variant-slot.status-collected {
      background-color: rgba(78, 159, 61, 0.25);
      border: 2px solid var(--collected-color);
      box-shadow: 0 0 12px rgba(78, 159, 61, 0.3);
    }

    .variant-slot.status-mastered {
      background-color: rgba(212, 175, 55, 0.25);
      border: 2px solid var(--mastered-color);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
    }

    .mastered-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.95rem;
      filter: drop-shadow(0 0 4px #FFD700);
      display: flex;
      align-items: center;
    }

    .mastered-badge img {
      width: 18px;
      height: 18px;
    }

    .is-capturing .spirit-quick-actions { display: none !important; }

    /* --- GARDEN GALLERY --- */
    .garden-gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
      gap: 28px;
    }

    /* ESTILOS DE RAREZA COMPARTIDOS (TARJETAS GARDEN Y MODAL) */
    .garden-card, .modal-content {
      transition: all 0.35s ease;
    }

    .card-rarity-rare {
      background: linear-gradient(180deg, rgba(0, 114, 255, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(0, 114, 255, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 114, 255, 0.3) !important;
    }
    .card-rarity-epic {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(168, 85, 247, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(168, 85, 247, 0.3) !important;
    }
    .card-rarity-legendary {
      background: linear-gradient(180deg, rgba(249, 115, 22, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(249, 115, 22, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(249, 115, 22, 0.3) !important;
    }
    .card-rarity-mythic {
      background: linear-gradient(180deg, rgba(234, 179, 8, 0.15) 0%, rgba(14, 20, 28, 0.94) 100%) !important;
      border: 1px solid rgba(234, 179, 8, 0.4) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 35px rgba(234, 179, 8, 0.3) !important;
    }

    .garden-card {
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
    }

    .garden-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .garden-card-header .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
    }
    .garden-card-header .dot-rare {
      background-color: #0072FF;
      border: 2px solid #60A5FA;
      box-shadow: 0 0 10px rgba(0, 114, 255, 0.9);
    }
    .garden-card-header .dot-epic {
      background-color: #A855F7;
      border: 2px solid #F3E8FF;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.9);
    }
    .garden-card-header .dot-legendary {
      background-color: #F97316;
      border: 2px solid #FFEDD5;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.9);
    }
    .garden-card-header .dot-mythic {
      background-color: #EAB308;
      border: 2px solid #FEF9C3;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.9);
    }

    .garden-card-header h3 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #FFF;
    }

    .garden-variants-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
    }

    .garden-vslot {
      position: relative;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
      background: #131625;
    }

    .garden-vslot.bg-variant-normal { background: radial-gradient(circle at center, rgba(148, 163, 184, 0.28) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-gold { background: radial-gradient(circle at center, rgba(255, 179, 0, 0.30) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-gummy { background: radial-gradient(circle at center, rgba(255, 64, 129, 0.28) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-galaxy { background: radial-gradient(circle at center, rgba(124, 77, 255, 0.32) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-holo, .garden-vslot.bg-variant-holofoil { background: radial-gradient(circle at center, rgba(0, 230, 118, 0.28) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-cube { background: radial-gradient(circle at center, rgba(170, 0, 255, 0.32) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-gem { background: radial-gradient(circle at center, rgba(241, 245, 249, 0.35) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-quack { background: radial-gradient(circle at center, rgba(216, 180, 254, 0.35) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-cheat, .garden-vslot.bg-variant-cheat-master { background: radial-gradient(circle at center, rgba(0, 230, 118, 0.28) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-hacker { background: radial-gradient(circle at center, rgba(29, 233, 182, 0.28) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-reaper { background: radial-gradient(circle at center, rgba(255, 23, 68, 0.30) 0%, rgba(15, 18, 32, 0.95) 75%); }
    .garden-vslot.bg-variant-trick, .garden-vslot.bg-variant-trick-treat { background: radial-gradient(circle at center, rgba(255, 109, 0, 0.30) 0%, rgba(15, 18, 32, 0.95) 75%); }

    .garden-vslot.empty-space {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      border: none;
      background: transparent !important;
      box-shadow: none !important;
    }

    .garden-vslot .badge-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      padding: 0 2px;
      z-index: 2;
    }

    .garden-vslot .season-tag, .modal-season-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .season-tag-s3, .modal-season-s3 {
      color: #FF9E80;
      background: rgba(224, 122, 95, 0.25);
      border: 1px solid rgba(224, 122, 95, 0.45);
      box-shadow: 0 0 8px rgba(224, 122, 95, 0.25);
    }
    .season-tag-s4, .modal-season-s4 {
      color: #E0AAFF;
      background: rgba(157, 78, 221, 0.25);
      border: 1px solid rgba(157, 78, 221, 0.45);
      box-shadow: 0 0 8px rgba(157, 78, 221, 0.25);
    }

    .garden-vslot img {
      max-width: 86%;
      max-height: 86%;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.7));
      margin: auto 0;
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .garden-vslot.uncollected-has-img {
      opacity: 0.45;
      filter: grayscale(35%);
      cursor: not-allowed;
    }

    .garden-vslot.status-inactive {
      opacity: 0.35;
      filter: grayscale(60%);
      cursor: not-allowed;
    }

    .garden-vslot.collected {
      opacity: 1;
      filter: none;
      border: 2px solid var(--collected-color);
      box-shadow: 0 0 14px rgba(78, 159, 61, 0.4);
      cursor: pointer;
    }

    .garden-vslot.mastered {
      opacity: 1;
      filter: none;
      border: 2px solid var(--mastered-color);
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.5);
      cursor: pointer;
    }

    .garden-vslot.collected:hover, .garden-vslot.mastered:hover {
      transform: translateY(-3px) scale(1.04);
    }

    .garden-vslot.collected:hover img, .garden-vslot.mastered:hover img {
      transform: scale(1.08);
    }

    /* --- VENTANA MODAL EMERGENTE (COLOR DE RAREZA EN TARJETA + VARIANTE EN MARCO) --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 24px;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      border-radius: 32px;
      width: 100%;
      max-width: 660px;
      padding: 38px 30px 28px 30px;
      display: flex;

<body class="theme-s3">

        <select id="capture-scope" class="capture-select" onchange="persistState()">
          <option value="all">📷 Mode: All Spirits</option>
          <option value="collected">📷 Mode: Collected</option>

        Select All

      <button class="action-btn btn-master" onclick="masterAllCurrentTab()">

  <!-- MODAL EMERGENTE -->
  <div id="spirit-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" id="modal-card-content" onclick="event.stopPropagation()">
      <div class="modal-top-bar">

  <script src="spiritsData.js"></script>
  <script src="html2canvas.min.js"></script>

  <script>
    const SPIRIT_SLUGS = {
      "8 bit": "8bit",
      "burnt peanut": "peanut",
      "zero point": "zp",
      "grim reaper": "grim",
      "john wick": "john",
      "vini jr.": "vini",
      "bush ranger": "bush-ranger",
      "storm scout": "storm",
      "jackrabbit": "jack",
      "x ray": "xray",
      "x-ray": "xray",
      "xray": "xray",
      "ghost knight": "knight",
      "knight": "knight",
      "ghost-knight": "knight",
      "onigiri": "onigiri",
      "bullet onigiri": "onigiri"
    };

    const VARIANT_SLUGS = {
      "Normal": "normal",
      "Gold": "gold",
      "Gummy": "gummy",
      "Galaxy": "galaxy",
      "Holofoil": "holo",
      "Cube": "cube",
      "Gem": "gem",
      "Quack": "quack",
      "Cheat Master": "cheat",
      "Hacker": "hacker",
      "Reaper": "reaper",
      "Trick Treat": "trick"
    };

    const VARIANT_DESCRIPTIONS = {
      "Normal": "Standard Sprite Variant",
      "Gold": "Gain 3x bonus XP from eliminations",
      "Gummy": "Gain 20% more Sprite Dust upon Extraction",
      "Galaxy": "Gain 30% more Ammo whenever picked up in the world",
      "Holofoil": "5% chance for your squad to find rare Sprite Variants from looting chests",
      "Holo": "5% chance for your squad to find rare Sprite Variants from looting chests",
      "Cube": "While in the Storm, gain the Overdrive Effect",
      "Gem": "Take 30% less Fall damage",
      "Quack": "Gives 50% Sprite XP to all other Sprites in your inventory",
      "Cheat Master": "Button mash! All inputs are correct when entering cheat codes found in the world.",
      "Cheat": "Button mash! All inputs are correct when entering cheat codes found in the world."
    };

    const VARIANT_GRADIENTS = {
      "normal": "radial-gradient(circle at center, rgba(148, 163, 184, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "gold": "radial-gradient(circle at center, rgba(255, 179, 0, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "gummy": "radial-gradient(circle at center, rgba(255, 64, 129, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "galaxy": "radial-gradient(circle at center, rgba(124, 77, 255, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "holo": "radial-gradient(circle at center, rgba(0, 230, 118, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "holofoil": "radial-gradient(circle at center, rgba(0, 230, 118, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "cube": "radial-gradient(circle at center, rgba(170, 0, 255, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "gem": "radial-gradient(circle at center, rgba(241, 245, 249, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "quack": "radial-gradient(circle at center, rgba(216, 180, 254, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "cheat": "radial-gradient(circle at center, rgba(0, 230, 118, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "hacker": "radial-gradient(circle at center, rgba(29, 233, 182, 0.35) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "reaper": "radial-gradient(circle at center, rgba(255, 23, 68, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)",
      "trick": "radial-gradient(circle at center, rgba(255, 109, 0, 0.40) 0%, rgba(14, 18, 30, 0.95) 80%)"
    };

    const VARIANT_BORDER_COLORS = {
      "normal": "#94A3B8",
      "gold": "#FFB300",
      "gummy": "#FF4081",
      "galaxy": "#7C4DFF",
      "holo": "#00E676",
      "holofoil": "#00E676",
      "cube": "#AA00FF",
      "gem": "#FFFFFF",
      "quack": "#C084FC",
      "cheat": "#00E676",
      "hacker": "#1DE9B6",
      "reaper": "#FF1744",
      "trick": "#FF6D00"
    };

    let currentTab = 'S3';
    let userProgress = JSON.parse(localStorage.getItem('fortnite_spirits_progress')) || {};

    function persistState() {
      localStorage.setItem('fortnite_spirits_tab', currentTab);
      localStorage.setItem('fortnite_spirits_search', document.getElementById('search-input')?.value || '');
      localStorage.setItem('fortnite_spirits_rarity', document.getElementById('rarity-filter')?.value || 'all');
      localStorage.setItem('fortnite_spirits_status', document.getElementById('status-filter')?.value || 'all');
      localStorage.setItem('fortnite_spirits_capture_scope', document.getElementById('capture-scope')?.value || 'all');
    }

    function onFilterChange() {
      persistState();
      renderView();
    }

    function doesStatusMatchFilter(currentStatus, filter) {
      if (filter === 'all') return true;
      if (filter === 'collected') return currentStatus === 'collected' || currentStatus === 'mastered';
      if (filter === 'mastered') return currentStatus === 'mastered';
      if (filter === 'none') return currentStatus === 'none';
      if (filter === 'not-mastered') return currentStatus !== 'mastered';
      return true;
    }

    function getVariantBadgeClass(vName) {
      const slug = (VARIANT_SLUGS[vName] || vName.toLowerCase()).replace(/\s+/g, '-');
      return `badge-${slug}`;
    }

    function getVariantRawStatus(spirit, variantName) {
      if (!spirit || !spirit.variants) return "Not Exist";
      const vObj = spirit.variants[variantName];
      if (!vObj) return "Not Exist";
      if (typeof vObj === 'string') return vObj;
      return vObj.status || (vObj.name ? "Available" : "Not Exist");
    }

    function isVariantExist(spirit, variantName) {
      const status = getVariantRawStatus(spirit, variantName);
      if (status === "Not Exist" || status === "Unreleased") {
        return false;
      }
      return true;
    }

    function isVariantInactive(spirit, variantName) {
      const status = getVariantRawStatus(spirit, variantName);
      return status === "Unavailable" || status === "Blocked";
    }

    function isVariantDefined(spirit, variantName) {
      return isVariantExist(spirit, variantName);
    }

    function getVariantsList() {
      if (currentTab === 'S3') {
        return (typeof S3_VARIANTS !== 'undefined') ? S3_VARIANTS : ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack"];
      }
      if (currentTab === 'S4') {
        return (typeof S4_VARIANTS !== 'undefined') ? S4_VARIANTS : ["Normal", "Gold", "Cheat Master", "Hacker", "Reaper", "Gummy", "Holofoil", "Trick Treat"];
      }
      return ["Normal", "Gold", "Gummy", "Galaxy", "Holofoil", "Cube", "Gem", "Quack", "Cheat Master", "Hacker", "Reaper", "Trick Treat"];
    }

    function getSpiritsList() {
      if (typeof SPIRITS_DATA === 'undefined' || !SPIRITS_DATA) return [];
      
      if (currentTab === 'S3') {
        return (SPIRITS_DATA.S3 || []).map(s => ({ ...s, _season: 'S3' }));
      }
      if (currentTab === 'S4') {
        return (SPIRITS_DATA.S4 || []).map(s => ({ ...s, _season: 'S4' }));
      }
      if (currentTab === 'Garden') {
        const s3 = (SPIRITS_DATA.S3 || []).map(s => ({ ...s, _season: 'S3' }));
        const s4 = (SPIRITS_DATA.S4 || []).map(s => ({ ...s, _season: 'S4' }));
        return [...s3, ...s4];
      }
      return [];
    }

    function saveProgress() {
      localStorage.setItem('fortnite_spirits_progress', JSON.stringify(userProgress));
      updateProgressUI();
    }

    function switchTab(tab, element) {
      currentTab = tab;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = element || document.getElementById(`btn-tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.body.className = `theme-${tab.toLowerCase()}`;
      
      const scopeSelect = document.getElementById('capture-scope');
      if (scopeSelect) {
        if (tab === 'Garden') {
          scopeSelect.value = 'all';
          scopeSelect.disabled = true;
        } else {
          scopeSelect.disabled = false;
          const savedScope = localStorage.getItem('fortnite_spirits_capture_scope') || 'all';
          scopeSelect.value = savedScope;
        }
      }

      persistState();
      renderView();
    }

    function updateProgressUI() {
      let totalItems = 0;
      let collectedCount = 0;
      let masteredCount = 0;

      const spirits = getSpiritsList();
      const variantsList = getVariantsList();

      spirits.forEach(spirit => {
        variantsList.forEach(vName => {
          if (isVariantExist(spirit, vName) && !isVariantInactive(spirit, vName)) {
            totalItems++;
            const status = userProgress[`${spirit.id}_${vName}`];
            if (status === 'collected' || status === 'mastered') collectedCount++;
            if (status === 'mastered') masteredCount++;
          }
        });
      });

      const collectedPct = totalItems > 0 ? Math.round((collectedCount / totalItems) * 100) : 0;
      const masteredPct = totalItems > 0 ? Math.round((masteredCount / totalItems) * 100) : 0;

      document.getElementById('collected-count').textContent = `${collectedCount}/${totalItems}`;
      document.getElementById('progress-pct').textContent = `${collectedPct}%`;
      document.getElementById('progress-bar-fill').style.width = `${collectedPct}%`;

      document.getElementById('mastered-count').textContent = `${masteredCount}/${totalItems}`;
      document.getElementById('mastered-pct').textContent = `${masteredPct}%`;
      document.getElementById('mastered-bar-fill').style.width = `${masteredPct}%`;
    }

    function renderView(overrideStatusFilter, isExportMode = false) {
      if (currentTab === 'Garden') {
        renderGardenGallery(overrideStatusFilter, isExportMode);
      } else {
        renderMatrixTable(overrideStatusFilter, isExportMode);
      }
      updateProgressUI();
    }

    function handleImgError(imgEl, seasonDir, spiritSlug, variantSlug) {
      imgEl.onerror = null;

      const cleanSlug = spiritSlug.replace(/[^a-z0-9]/gi, '');
      const shortSlug = spiritSlug.split('-').pop();

      const fallbacks = [
        `assets/${seasonDir}/${spiritSlug}_${variantSlug}.webp`,
        `assets/${seasonDir}/${cleanSlug}_${variantSlug}.webp`,
        `assets/${seasonDir}/${shortSlug}_${variantSlug}.webp`,
        `${spiritSlug}_${variantSlug}.webp`,
        `${cleanSlug}_${variantSlug}.webp`,
        `${shortSlug}_${variantSlug}.webp`,
        `assets/unreleased/${spiritSlug}_${variantSlug}.webp`,
        `assets/unreleased/${cleanSlug}_${variantSlug}.webp`,
        `unreleased/${spiritSlug}_${variantSlug}.webp`,
        `assets/${seasonDir}/${spiritSlug}.webp`,
        `assets/unreleased/${spiritSlug}.webp`,
        `assets/${spiritSlug}.webp`
      ];

      let step = 0;
      function tryNext() {
        if (step < fallbacks.length) {
          const nextSrc = fallbacks[step++];
          imgEl.onerror = tryNext;
          imgEl.src = nextSrc;
        } else {
          imgEl.onerror = null;
          imgEl.style.display = 'none';
          const slot = imgEl.parentElement;
          if (slot && !slot.querySelector('.fallback-placeholder')) {
            const ph = document.createElement('span');
            ph.className = 'fallback-placeholder';
            ph.innerHTML = '👁️';
            ph.style.cssText = 'font-size: 1.5rem; opacity: 0.3; margin: auto;';
            slot.appendChild(ph);
          }
        }
      }
      tryNext();
    }

    /* MATRIZ (S3 / S4) */
    function renderMatrixTable(overrideStatusFilter, isExportMode = false) {
      const container = document.getElementById('content-render-area');
      if (!container) return;

      const spirits = getSpiritsList();
      const fullVariantsList = getVariantsList();

      if (spirits.length === 0) {
        container.innerHTML = '<div class="empty-warning">⚠️ No se encontraron espíritus para esta categoría.</div>';
        return;
      }

      const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase();
      const rarityFilter = document.getElementById('rarity-filter')?.value || 'all';
      const statusFilter = overrideStatusFilter !== undefined ? overrideStatusFilter : (document.getElementById('status-filter')?.value || 'all');

      let activeVariants = fullVariantsList;
      if (statusFilter !== 'all') {
        activeVariants = fullVariantsList.filter(vName => 
          spirits.some(spirit => {
            if (!isVariantExist(spirit, vName)) return false;
            const status = userProgress[`${spirit.id}_${vName}`] || 'none';
            return doesStatusMatchFilter(status, statusFilter);
          })
        );
      }

      let html = `<div class="matrix-grid" style="grid-template-columns: 210px repeat(${activeVariants.length}, minmax(110px, 1fr));">`;

      html += `<div class="matrix-header-cell spirit-col">SPRITE</div>`;
      activeVariants.forEach(vName => {
        const badgeClass = getVariantBadgeClass(vName);
        html += `<div class="matrix-header-cell"><span class="header-badge ${badgeClass}">${vName}</span></div>`;
      });

      spirits.forEach(spirit => {
        const spiritName = spirit.name || 'Unknown';
        const spiritRarity = spirit.rarity || 'Rare';
        const spiritId = spirit.id || spiritName;

        if (searchVal && !spiritName.toLowerCase().includes(searchVal)) return;
        if (rarityFilter !== 'all' && spiritRarity.toLowerCase() !== rarityFilter.toLowerCase()) return;

        let matchingVariantsCount = 0;
        activeVariants.forEach(vName => {
          if (isVariantExist(spirit, vName)) {
            const currentStatus = userProgress[`${spiritId}_${vName}`] || 'none';
            if (doesStatusMatchFilter(currentStatus, statusFilter)) {
              matchingVariantsCount++;
            }
          }
        });

        if (statusFilter !== 'all' && matchingVariantsCount === 0) return;

        html += `
          <div class="spirit-info-cell">
            <div class="spirit-name-row">
              <span class="spirit-name">${spiritName}</span>
              <div class="spirit-quick-actions">
                <button class="mini-btn mini-select" title="Select All" onclick="setSpiritState('${spiritId}', 'collected')">
                  <img src="green.webp" onerror="this.onerror=null; this.src='assets/green.webp'; this.onerror=function(){this.replaceWith('✓');};" alt="✓">
                </button>
                <button class="mini-btn mini-master" title="Master All" onclick="setSpiritState('${spiritId}', 'mastered')">
                  <img src="crown.webp" onerror="this.onerror=null; this.src='assets/crown.webp'; this.onerror=function(){this.replaceWith('👑');};" alt="👑">
                </button>
                <button class="mini-btn mini-clear" title="Clear All" onclick="setSpiritState('${spiritId}', 'none')">
                  <img src="red.webp" onerror="this.onerror=null; this.src='assets/red.webp'; this.onerror=function(){this.replaceWith('✕');};" alt="✕">
                </button>
              </div>
            </div>
            <span class="rarity-pill rarity-${spiritRarity.toLowerCase()}">${spiritRarity.toUpperCase()}</span>
          </div>
        `;

        const spiritSlug = SPIRIT_SLUGS[spiritName.toLowerCase()] || spiritName.toLowerCase().replace(/\s+/g, '-');
        const seasonDir = spirit._season || currentTab;

        activeVariants.forEach(vName => {
          const exists = isVariantExist(spirit, vName);
          const inactive = isVariantInactive(spirit, vName);

          if (!exists) {
            html += `<div class="variant-slot na"></div>`;
          } else {
            const key = `${spiritId}_${vName}`;
            const currentStatus = userProgress[key] || 'none';
            const isMatch = doesStatusMatchFilter(currentStatus, statusFilter);

            if (!isMatch && statusFilter !== 'all') {
              html += `<div class="variant-slot empty-cell"></div>`;
            } else {
              const variantSlug = VARIANT_SLUGS[vName] || vName.toLowerCase();
              const imgPathPrimary = `assets/${seasonDir}/${spiritSlug}_${variantSlug}.webp`;
              const masteredIconHTML = `<span class="mastered-badge"><img src="crown.webp" onerror="this.onerror=null; this.src='assets/crown.webp'; this.onerror=function(){this.replaceWith('👑');};" alt="👑"></span>`;

              const clickAction = inactive ? '' : `onclick="toggleVariantState('${spiritId}', '${vName}')"`;
              const slotStateClass = inactive ? 'status-inactive' : `status-${currentStatus}`;

              html += `
                <div class="variant-slot ${slotStateClass}" ${clickAction}>
                  ${currentStatus === 'mastered' && !inactive ? masteredIconHTML : ''}
                  <img src="${imgPathPrimary}" alt="${spiritName}" 
                       onerror="handleImgError(this, '${seasonDir}', '${spiritSlug}', '${variantSlug}')">
                </div>
              `;
            }
          }
        });
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    /* --- GARDEN GALLERY --- */
    function renderGardenGallery(overrideStatusFilter, isExportMode = false) {
      const container = document.getElementById('content-render-area');
      if (!container) return;

      const spirits = getSpiritsList();
      const canonicalVariantsList = getVariantsList();

      const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase();
      const rarityFilter = document.getElementById('rarity-filter')?.value || 'all';
      const statusFilter = overrideStatusFilter !== undefined ? overrideStatusFilter : (document.getElementById('status-filter')?.value || 'all');

      let html = `<div class="garden-gallery-container">`;

      spirits.forEach(spirit => {
        const spiritName = spirit.name || 'Unknown';
        const spiritRarity = (spirit.rarity || 'Rare').toLowerCase();
        const spiritId = spirit.id || spiritName;

        if (searchVal && !spiritName.toLowerCase().includes(searchVal)) return;
        if (rarityFilter !== 'all' && spiritRarity !== rarityFilter.toLowerCase()) return;

        const slotsMap = canonicalVariantsList.map((vName, idx) => {
          const defined = isVariantDefined(spirit, vName);
          const inactive = isVariantInactive(spirit, vName);
          const currentStatus = userProgress[`${spiritId}_${vName}`] || 'none';
          const isMatch = doesStatusMatchFilter(currentStatus, statusFilter);
          return { vName, defined, inactive, currentStatus, isMatch, idx };
        });

        const rows = [];
        for (let i = 0; i < slotsMap.length; i += 4) {
          rows.push(slotsMap.slice(i, i + 4));
        }

        const activeRows = rows.filter(row => 
          row.some(slot => slot.defined && (statusFilter === 'all' || slot.isMatch))
        );

        if (activeRows.length === 0) return;

        html += `
          <div class="garden-card card-rarity-${spiritRarity}">
            <div class="garden-card-header">
              <span class="dot dot-${spiritRarity}"></span>
              <h3>${spiritName}</h3>
            </div>
            <div class="garden-variants-grid">
        `;

        const spiritSlug = SPIRIT_SLUGS[spiritName.toLowerCase()] || spiritName.toLowerCase().replace(/\s+/g, '-');
        const seasonDir = spirit._season || 'S3';
        const seasonPinClass = (seasonDir === 'S4') ? 'season-tag-s4' : 'season-tag-s3';

        activeRows.forEach(row => {
          row.forEach(slot => {
            const { vName, defined, inactive, currentStatus, isMatch } = slot;

            if (!defined || (!isMatch && statusFilter !== 'all')) {
              html += `<div class="garden-vslot empty-space"></div>`;
            } else {
              const variantSlug = VARIANT_SLUGS[vName] || vName.toLowerCase();
              const badgeClass = getVariantBadgeClass(vName);
              const imgPathPrimary = `assets/${seasonDir}/${spiritSlug}_${variantSlug}.webp`;
              const isObtained = (currentStatus === 'collected' || currentStatus === 'mastered') && !inactive;
              const clickAttr = (isObtained && !inactive) ? `onclick="openSpiritModal('${spiritId}', '${vName}')"` : '';

              let slotClass = inactive ? 'status-inactive' : (isObtained ? currentStatus : 'uncollected-has-img');
              const bgVariantClass = `bg-variant-${variantSlug.replace(/\s+/g, '-')}`;

              html += `
                <div class="garden-vslot ${bgVariantClass} ${slotClass}" ${clickAttr}>
                  <div class="badge-container">
                    <span class="badge-variant ${badgeClass}">${vName}</span>
                    <span class="season-tag ${seasonPinClass}">${seasonDir}</span>
                  </div>
                  <img src="${imgPathPrimary}" alt="${spiritName}"
                       onerror="handleImgError(this, '${seasonDir}', '${spiritSlug}', '${variantSlug}')">
                </div>
              `;
            }
          });
        });

        html += `
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    /* GESTIÓN DE ESTADOS */
    function toggleVariantState(spiritId, variant) {
      if (currentTab === 'Garden') return;

      const spirits = getSpiritsList();
      const targetSpirit = spirits.find(s => s.id === spiritId);
      if (targetSpirit && isVariantInactive(targetSpirit, variant)) return;

      const key = `${spiritId}_${variant}`;
      const currentState = userProgress[key] || 'none';

      if (currentState === 'none') {
        userProgress[key] = 'collected';
      } else if (currentState === 'collected') {
        userProgress[key] = 'mastered';
      } else {
        delete userProgress[key];
      }

      saveProgress();
      renderView();
    }

    function setSpiritState(spiritId, targetState) {
      const spirits = getSpiritsList();
      const targetSpirit = spirits.find(s => s.id === spiritId);
      if (!targetSpirit) return;

      const variantsList = getVariantsList();
      variantsList.forEach(vName => {
        if (isVariantExist(targetSpirit, vName) && !isVariantInactive(targetSpirit, vName)) {
          if (targetState === 'none') {
            delete userProgress[`${spiritId}_${vName}`];
          } else {
            userProgress[`${spiritId}_${vName}`] = targetState;
          }
        }
      });

      saveProgress();
      renderView();
    }

    function selectAllCurrentTab() { setTabState('collected'); }
    function masterAllCurrentTab() { setTabState('mastered'); }
    function clearAllCurrentTab() {
      const spirits = getSpiritsList();
      const variantsList = getVariantsList();
      spirits.forEach(spirit => {
        variantsList.forEach(vName => {
          delete userProgress[`${spirit.id}_${vName}`];
        });
      });
      saveProgress();
      renderView();
    }

    function setTabState(targetState) {
      const spirits = getSpiritsList();
      const variantsList = getVariantsList();
      spirits.forEach(spirit => {
        variantsList.forEach(vName => {
          if (isVariantExist(spirit, vName) && !isVariantInactive(spirit, vName)) {
            userProgress[`${spirit.id}_${vName}`] = targetState;
          }
        });
      });
      saveProgress();
      renderView();
    }

    /* VENTANA MODAL CON COLOR DE RAREZA EN TARJETA Y VARIANTE EN MARCO */
    function openSpiritModal(spiritId, variantName) {
      const spirits = getSpiritsList();
      const spirit = spirits.find(s => s.id === spiritId);
      if (!spirit) return;

      const season = spirit._season || 'S3';
      const spiritName = spirit.name;
      const spiritRarity = (spirit.rarity || 'Rare').toLowerCase();
      const spiritSlug = SPIRIT_SLUGS[spiritName.toLowerCase()] || spiritName.toLowerCase().replace(/\s+/g, '-');
      const variantSlug = VARIANT_SLUGS[variantName] || variantName.toLowerCase();

      const imgPathPrimary = `assets/${season}/${spiritSlug}_${variantSlug}.webp`;

      // 1. Color de Rareza a la Tarjeta Modal Completa
      const modalContent = document.getElementById('modal-card-content');
      modalContent.className = `modal-content card-rarity-${spiritRarity}`;

      // 2. Insignia de Rareza en Header
      const modalRarityBadge = document.getElementById('modal-rarity-badge');
      if (modalRarityBadge) {
        modalRarityBadge.textContent = (spirit.rarity || 'Rare').toUpperCase();
        modalRarityBadge.className = `rarity-pill rarity-${spiritRarity}`;
      }

      // 3. Pin de Temporada
      const modalSeasonBadge = document.getElementById('modal-season');
      modalSeasonBadge.textContent = season;
      modalSeasonBadge.className = `modal-season-badge modal-season-${season.toLowerCase()}`;

      // 4. Insignia de Variante
      const modalVariantBadge = document.getElementById('modal-variant-badge');
      if (modalVariantBadge) {
        modalVariantBadge.textContent = variantName;
        modalVariantBadge.className = `badge-variant ${getVariantBadgeClass(variantName)}`;
      }

      // 5. Marco de la Imagen: Mantiene el Fondo Radial y Borde de la VARIANTE
      const frameEl = document.getElementById('modal-img-frame');
      const gradientBg = VARIANT_GRADIENTS[variantSlug] || VARIANT_GRADIENTS["normal"];
      const borderColor = VARIANT_BORDER_COLORS[variantSlug] || "#94A3B8";

      frameEl.style.background = gradientBg;
      frameEl.style.borderColor = borderColor;
      frameEl.style.boxShadow = `0 0 38px ${borderColor}80, 0 10px 32px rgba(0,0,0,0.85)`;

      document.getElementById('modal-title').textContent = `${variantName} ${spiritName}`;
      
      const imgEl = document.getElementById('modal-img');
      imgEl.style.display = 'block';
      imgEl.src = imgPathPrimary;
      imgEl.onerror = function() {
        handleImgError(this, season, spiritSlug, variantSlug);
      };

      document.getElementById('modal-desc-main').textContent = spirit.desc_sprite || "Replenish shields while standing in water!";
      
      let subDesc = spirit.desc_level || "Increases in power at each Level Up per tick:";
      if (spirit.levels && Object.keys(spirit.levels).length > 0) {
        subDesc += " " + Object.entries(spirit.levels).map(([k, v]) => `${k}: ${v}`).join(' | ');
      }
      document.getElementById('modal-desc-sub').textContent = subDesc;

      const xpBanner = document.getElementById('modal-xp-banner');
      xpBanner.textContent = VARIANT_DESCRIPTIONS[variantName] || "Standard Sprite Variant perk applied.";

      document.getElementById('spirit-modal').classList.add('active');
    }

    function closeModal(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      document.getElementById('spirit-modal').classList.remove('active');
    }

    async function exportCard() {
      let captureScope = document.getElementById('capture-scope')?.value || 'all';
      
      if (currentTab === 'Garden') {
        captureScope = 'all';
      }

      let filterOverride = 'all';
      if (captureScope === 'collected') filterOverride = 'collected';
      if (captureScope === 'uncollected') filterOverride = 'none';
      if (captureScope === 'mastered') filterOverride = 'mastered';
      if (captureScope === 'not-mastered') filterOverride = 'not-mastered';

      renderView(filterOverride, true);

      const captureElement = document.getElementById('capture-area-container');
      const btn = document.querySelector('.btn-export');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Processing...';
      btn.disabled = true;

      captureElement.classList.add('is-capturing');

      await new Promise(resolve => setTimeout(resolve, 80));

      try {
        if (typeof html2canvas !== 'undefined') {
          const canvas = await html2canvas(captureElement, { 
            scale: 1.2,
            useCORS: true,
            logging: false,
            backgroundColor: '#0C0A14'
          });

          const link = document.createElement('a');
          link.download = `spirits-${currentTab.toLowerCase()}-${captureScope}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } else {
          alert('html2canvas.min.js no está cargado correctamente.');
        }
      } catch (err) {
        console.error("Error al exportar captura:", err);
      } finally {
        captureElement.classList.remove('is-capturing');
        btn.innerHTML = originalText;
        btn.disabled = false;
        renderView();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedTab = localStorage.getItem('fortnite_spirits_tab') || 'S3';
      const savedSearch = localStorage.getItem('fortnite_spirits_search') || '';
      const savedRarity = localStorage.getItem('fortnite_spirits_rarity') || 'all';
      const savedStatus = localStorage.getItem('fortnite_spirits_status') || 'all';
      const savedScope = localStorage.getItem('fortnite_spirits_capture_scope') || 'all';

      if (document.getElementById('search-input')) document.getElementById('search-input').value = savedSearch;
      if (document.getElementById('rarity-filter')) document.getElementById('rarity-filter').value = savedRarity;
      if (document.getElementById('status-filter')) document.getElementById('status-filter').value = savedStatus;
      if (document.getElementById('capture-scope')) document.getElementById('capture-scope').value = savedScope;

      switchTab(savedTab);
    });
  </script>
</body>
